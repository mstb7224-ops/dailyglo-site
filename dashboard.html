<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard | Master Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">

    <!-- Navbar -->
    <nav class="flex justify-between items-center p-6 bg-slate-800 border-b border-slate-700 shadow-xl">
        <h1 class="text-2xl font-bold text-blue-400 tracking-tight">MASTER ENGINE</h1>
        <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-bold transition-all">Logout</button>
    </nav>

    <!-- Dashboard Content -->
    <div class="flex flex-col items-center justify-center mt-20 px-6">
        <div id="loader" class="text-blue-400 animate-pulse text-xl font-medium">Checking status...</div>

        <div id="dashboardContent" class="hidden w-full max-w-md bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700 text-center">
            <div class="mb-6">
                <div id="userBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-2"></div>
                <h2 class="text-3xl font-bold mt-2">Welcome Back!</h2>
                <p id="userEmail" class="text-slate-400 text-sm"></p>
            </div>

            <div class="py-6 px-4 bg-slate-900 rounded-2xl border border-slate-700 mb-8">
                <p class="text-slate-300 text-sm italic">"Accuracy is the only truth."</p>
            </div>

            <!-- Dynamic Action Button -->
            <div id="actionArea">
                <!-- Button will be injected by JS -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/supabase-client.js"></script>
    <script>
        const loader = document.getElementById('loader');
        const dashboardContent = document.getElementById('dashboardContent');
        const userBadge = document.getElementById('userBadge');
        const userEmail = document.getElementById('userEmail');
        const actionArea = document.getElementById('actionArea');
        const logoutBtn = document.getElementById('logoutBtn');

        async function initDashboard() {
            try {
                // ১. ইউজার ডাটা ফেচ করা
                const { data: { user }, error: authError } = await supabase.auth.getUser();
                if (authError || !user) {
                    window.location.href = 'index.html';
                    return;
                }

                // ২. ইউজার টাইপ চেক করা
                const { data: memberData, error: dbError } = await supabase
                    .from('members')
                    .select('user_type')
                    .eq('id', user.id)
                    .single();

                if (dbError) throw dbError;

                // UI আপডেট করা
                userEmail.innerText = user.email;
                loader.classList.add('hidden');
                dashboardContent.classList.remove('hidden');

                if (memberData.user_type === 'paid') {
                    userBadge.innerText = "Paid Member";
                    userBadge.classList.add('bg-green-500', 'text-white');
                    actionArea.innerHTML = `
                        <a href="predictions.html" class="block w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all transform active:scale-95 shadow-lg text-center">
                            View Predictions ⚡
                        </a>`;
                } else {
                    userBadge.innerText = "Free Member";
                    userBadge.classList.add('bg-slate-600', 'text-slate-200');
                    actionArea.innerHTML = `
                        <a href="payment.html" class="block w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-all transform active:scale-95 shadow-lg text-center">
                            Upgrade to Paid 🚀
                        </a>`;
                }

            } catch (err) {
                console.error(err);
                loader.innerText = "Error loading dashboard!";
            }
        }

        // Logout Logic
        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        initDashboard();
    </script>
</body>
</html>
