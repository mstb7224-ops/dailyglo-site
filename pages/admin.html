<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - DailyGlo</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="animated-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="dot-grid"></div></div>
<div class="admin-login-overlay" id="loginOverlay"><div class="form-card" style="max-width:400px;"><div class="form-header"><div class="form-icon">&#128274;</div><h2>Admin Login</h2></div><form id="adminLoginForm"><div class="form-group"><label>Username</label><input type="text" id="adminUser" class="form-control" required></div><div class="form-group"><label>Password</label><input type="password" id="adminPass" class="form-control" required></div><button type="submit" class="btn btn-gold btn-block">Login</button><div id="statusMsg" class="status-msg"></div></form><div class="form-footer"><a href="../index.html">Back to Home</a></div></div></div>
<div id="adminContent" style="display:none;"><nav class="site-navbar"><div class="nav-inner"><a href="../index.html" class="nav-logo"><span class="logo-icon">&#9733;</span>DailyGlo</a><div class="nav-auth"><button onclick="sessionStorage.removeItem('dailyglo_admin');location.reload()" class="btn-nav btn-nav-outline">Logout</button></div></div></nav>
<div class="admin-page"><div class="admin-header"><h2>Admin Dashboard</h2><button onclick="AdminDashboard.load()" class="btn btn-dark btn-sm">Refresh</button></div>
<div class="stats-grid"><div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total Members</div></div><div class="stat-card"><div class="stat-value" id="statPending" style="color:var(--warning);">0</div><div class="stat-label">Pending</div></div><div class="stat-card"><div class="stat-value" id="statApproved" style="color:var(--success);">0</div><div class="stat-label">Approved</div></div></div>
<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Member ID</th><th>Name</th><th>Mobile</th><th>Email</th><th>Location</th><th>Status</th><th>Date</th></tr></thead><tbody id="membersTable"><tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:40px;">Loading...</td></tr></tbody></table></div></div></div>
<script src="../js/app.js"></script>
</body>
</html>
