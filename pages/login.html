<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - DailyGlo</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="animated-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="dot-grid"></div>
</div>

<nav class="site-navbar" id="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo">
      <span class="logo-icon">&#9733;</span>
      DailyGlo
    </a>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="nav-auth">
      <a href="login.html" class="btn-nav btn-nav-outline">Login</a>
      <a href="register.html" class="btn-nav btn-nav-solid">Register</a>
    </div>
    <button class="mobile-menu-btn" onclick="toggleMobileMenu()">&#9776;</button>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="../index.html">Home</a>
  <a href="faq.html">FAQ</a>
  <a href="contact.html">Contact</a>
  <div class="mobile-auth">
    <a href="login.html" class="btn btn-outline btn-sm">Login</a>
    <a href="register.html" class="btn btn-gold btn-sm">Register</a>
  </div>
</div>

<div class="form-page">
  <div class="form-card">
    <div class="form-header">
      <div class="form-icon">&#128274;</div>
      <h2>Member Login</h2>
      <p>Access your account to submit payments</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email or Mobile <span class="required">*</span></label>
        <input type="text" id="loginId" class="form-control" placeholder="your@email.com or +96650XXXXXXX" required>
        <p class="form-hint">Enter your registered email or mobile number</p>
      </div>

      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <input type="password" id="password" class="form-control" placeholder="Your password" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-gold btn-block">Login</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>

    <div class="form-footer">
      <p>Don't have an account? <a href="register.html">Register here</a></p>
      <p style="margin-top:8px;font-size:0.8rem;">Forgot ID? <a href="contact.html">Contact support</a></p>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
</body>
</html>
