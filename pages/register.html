<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - DailyGlo</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="animated-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="dot-grid"></div>
</div>

<nav class="site-navbar" id="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo">
      <span class="logo-icon">&#9733;</span>
      DailyGlo
    </a>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="nav-auth">
      <a href="login.html" class="btn-nav btn-nav-outline">Login</a>
      <a href="register.html" class="btn-nav btn-nav-solid">Register</a>
    </div>
    <button class="mobile-menu-btn" onclick="toggleMobileMenu()">&#9776;</button>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="../index.html">Home</a>
  <a href="faq.html">FAQ</a>
  <a href="contact.html">Contact</a>
  <div class="mobile-auth">
    <a href="login.html" class="btn btn-outline btn-sm">Login</a>
    <a href="register.html" class="btn btn-gold btn-sm">Register</a>
  </div>
</div>

<div class="form-page">
  <div class="form-card">
    <div class="form-header">
      <div class="form-icon">&#128100;</div>
      <h2>Create Account</h2>
      <p>Join DailyGlo and get your unique Member ID</p>
    </div>

    <form id="regForm">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label>Mobile <span class="required">*</span></label>
          <input type="tel" id="mobile" class="form-control" placeholder="+966501234567" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>City <span class="required">*</span></label>
          <input type="text" id="city" class="form-control" placeholder="Your city" required>
        </div>
        <div class="form-group">
          <label>Country <span class="required">*</span></label>
          <select id="country" class="form-control" required>
            <option value="">Select</option>
            <option>Saudi Arabia</option>
            <option>Bangladesh</option>
            <option>India</option>
            <option>Pakistan</option>
            <option>UAE</option>
            <option>Qatar</option>
            <option>Kuwait</option>
            <option>Bahrain</option>
            <option>Oman</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <input type="password" id="password" class="form-control" placeholder="Min 6 characters" minlength="6" required>
      </div>

      <div class="form-group">
        <label>Iqama Photo <span class="required">*</span></label>
        <div class="form-file">
          <input type="file" id="iqamaFile" accept="image/*" required>
          <div class="file-label">
            <span class="file-icon">&#128247;</span>
            <span class="file-text">
              <strong>Click to upload Iqama</strong>
              <br>
              <span style="font-size:0.8rem;color:var(--text-muted);">JPG, PNG up to 5MB</span>
            </span>
          </div>
        </div>
        <img id="filePreview" class="file-preview" style="display:none;" alt="Preview">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-gold btn-block">Register</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>

    <div class="form-footer">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
</body>
</html>
